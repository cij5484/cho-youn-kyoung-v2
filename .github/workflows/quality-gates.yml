name: V2 reusable quality gates

on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      production_artifact:
        type: boolean
        default: false
      preview_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate workflow syntax and configuration
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Pin npm and install lockfile
        run: |
          npm install --global npm@11.12.1
          npm ci --include=dev
      - name: Fast gate - types, lint, locale, placement and root prerender
        run: npm run gate:fast
      - name: Project base build and deterministic placement
        if: inputs.full
        run: npm run build:pages-preview
      - name: Install full-gate browser
        if: inputs.full
        run: npx playwright install --with-deps chromium webkit
      - name: Full gate - both static hosts, metadata, hydration and 404
        if: inputs.full
        run: npm run test:spike
      - name: Full gate - development-only Design System Lab
        if: inputs.full
        run: npm run test:design-system
      - name: Full gate - development-only Editorial Navigation Lab
        if: inputs.full
        run: npm run test:navigation
      - name: Full gate - development-only HOME Hero Lab
        if: inputs.full
        run: npm run test:hero
      - name: Full gate - development-only Hero to Haegeum Lab
        if: inputs.full
        run: npm run test:haegeum
      - name: Full gate - development-only HOME Sound Lab
        if: inputs.full
        run: npm run test:sound
      - name: Full gate - development-only interaction regression
        if: inputs.full
        run: npm run test:interaction
      - name: Retain full-gate evidence
        if: always() && inputs.full
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: full-gate-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
            build-root/static/build-info.json
            build-pages-preview/static/build-info.json
          retention-days: 14
      - name: Checkout pinned independent Classic for the entry destination
        if: inputs.full || inputs.preview_artifact || inputs.production_artifact
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: cij5484/cho-youn-kyoung
          ref: 239d18056d8b3df2cf9a5fd5509f897f85ed70ad
          path: .checkpoints/entry-classic-source
          persist-credentials: false
      - name: Install independent Classic lockfile
        if: inputs.full || inputs.preview_artifact || inputs.production_artifact
        run: npm ci --include=dev --prefix .checkpoints/entry-classic-source
      - name: Build entry and both modes for the selected origin
        if: inputs.full || inputs.preview_artifact || inputs.production_artifact
        env:
          CLASSIC_REPOSITORY: .checkpoints/entry-classic-source
          PRODUCTION: ${{ inputs.full || inputs.production_artifact }}
        run: |
          if [ "$PRODUCTION" = true ]; then npm run build:production; else npm run build:development-preview; fi
      - name: Check production HTML, metadata and legacy document placement
        if: inputs.full || inputs.production_artifact
        run: npm run test:production-artifact
      - name: Full gate - actual built WORKS filtering on desktop and mobile
        if: inputs.full
        run: npm run test:works:production
      - name: Retain production WORKS failure evidence
        if: failure() && inputs.full
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-works-${{ github.sha }}
          path: test-results/production-works/
          retention-days: 14
      - name: Upload Fast-validated Pages artifact
        if: success() && inputs.preview_artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ inputs.production_artifact && 'build-production' || 'build-development-preview' }}
      - name: Retain production readiness artifact without deployment
        if: success() && inputs.production_artifact && !inputs.preview_artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-readiness-${{ github.sha }}
          path: build-production
          retention-days: 7
