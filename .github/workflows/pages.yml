name: V2 Automatic Pages Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-preview-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality-gates.yml
    with:
      preview_artifact: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy V2 artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm public preview opens
        env:
          PREVIEW_URL: https://cij5484.github.io/cho-youn-kyoung-v2/
        run: |
          curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --retry-all-errors \
            "$PREVIEW_URL" --output "$RUNNER_TEMP/preview.html"
          test -s "$RUNNER_TEMP/preview.html"
          echo "Preview is reachable: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
