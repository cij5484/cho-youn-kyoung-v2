name: V2 Full Gate and Preview Delivery

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy the validated artifact to V2 preview (requires user authorization)'
        type: boolean
        default: false
      expected_sha:
        description: 'Approved full 40-character commit SHA at the selected ref'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: v2-preview-pages
  cancel-in-progress: false

jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate exact revision and preview delivery scope
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
          DEPLOY: ${{ inputs.deploy }}
        run: |
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Provide the full approved commit SHA'; exit 1; }
          [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]] || { echo 'Selected ref changed; review the new revision before dispatch'; exit 1; }
          if [[ "$DEPLOY" == 'true' && "$ACTUAL_REF" != 'refs/heads/main' ]]; then
            echo 'Only main may deploy to the shared V2 preview'
            exit 1
          fi

  full:
    needs: request
    uses: ./.github/workflows/quality-gates.yml
    with:
      full: true
      pages_artifact: ${{ inputs.deploy }}

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: full
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy V2 artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
      - run: |
          npm install --global npm@11.12.1
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Verify real Pages routes and deployed file hashes
        run: npm run test:pages
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-verification-${{ github.sha }}
          path: |
            test-results-pages/
            playwright-pages-report/
          retention-days: 14
