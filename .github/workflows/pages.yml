name: V2 neutral preview Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'evidence/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-preview-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Pin npm and install lockfile
        run: |
          npm install --global npm@11.12.1
          npm ci --include=dev
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:placement
      - name: Root build contract
        run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}
      - name: Project build and deterministic static placement
        run: npm run build:pages-preview
        env:
          BUILD_SHA: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build-pages-preview/static

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy V2 artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.15.0'
          cache: npm
      - run: |
          npm install --global npm@11.12.1
          npm ci --include=dev
          npx playwright install --with-deps chromium
      - name: Verify real Pages routes and deployed file hashes
        run: npm run test:pages
        env:
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
      - name: Save live verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pages-verification-${{ github.sha }}
          path: |
            test-results-pages/
            playwright-pages-report/
          retention-days: 14
